<body><header class="top"><div class="head"><div class="brand"><div class="cap">🎓</div><div><h1>데이터로 정리하는 나의 중학교 3년</h1></div></div></div><nav class="tabs" id="tabs"></nav></header><main class="wrap"><section class="intro"><span class="eyebrow" id="stepLabel">STEP 01</span><h2 id="stepTitle">나의 중학교 3년 데이터 기획하기</h2><p id="stepDesc">어떤 데이터로 지난 3년을 돌아보고 표현할지 핵심 주제를 기획해봅시다.</p></section><div id="screen"></div></main><div id="toast" class="toast hide"></div>
<script>
const steps=[['기획 🎯','나의 중학교 3년 데이터 기획하기','어떤 데이터로 지난 3년을 돌아보고 표현할지 핵심 주제를 기획해봅시다.'],['데이터 수집 📊','중학교 3년 데이터 수집하기','학기별 수치, 능력치 점수, 타임라인 데이터를 솔직하게 수집합니다.'],['데이터 분석 🔍','수집한 데이터 분석 & 인사이트 도출','수집된 데이터의 평균과 변화 추이를 파악하고 포스터에 담을 스토리를 정리합니다.'],['포스터 완성 🎨','포스터 테마 선택 및 인포그래픽 완성','테마 선택과 포스터 완성을 한 STEP에 진행합니다.'],['성찰 🚀','중학교 3년 프로젝트 성찰','완성한 포스터를 돌아보며 성찰문을 작성합니다.']];let step=0, topic='',showList=false,viewMode='3인칭',filtered='전체 보기';const themes={peach:['피치 핑크','#fff0f6'],mint:['소프트 민트','#eaf9f1'],lavender:['라벤더 드림','#f0edff'],lemon:['버터 레몬','#fff9dc']};const topics=[['growth','📈','성장과 변화','행복지수, 성장 능력치, 키/학업 지수의 변화 패턴 중심','#fff0f7'],['friends','🤝','우정과 추억','친구들과 함께한 타임라인, 최애 장소, 소중한 순간들','#edf5ff'],['passion','🔥','열정과 취향','동아리, 취미 관심사 비율, 가장 열정을 쏟았던 TOP 3','#e8fbf2'],['future','🚀','도전과 미래','시련 극복 스트레스 지수, 새로 얻은 무기와 고등학교 목표','#f6edff']];const extraQuestions=['가장 많이 한 활동과 주당 횟수는?','가장 뿌듯한 성과와 변화량은?','계속하고 싶은 활동과 주당 횟수는?'];const extraExamples=['예: 축구, 주 3회','예: 수학 점수 15점 상승','예: 기타 연주, 주 2회'];const defaults={'keyword-1':'','keyword-2':'','keyword-3':'','project-intent':'','poster-headline':'','poster-subline':'','insight-pattern':'','final-reflection':'','moment-1':'','moment-2':'','moment-3':'','top-1':'','top-2':'','top-3':''};let data={...defaults,happy:[0,0,0,0,0,0],stress:[0,0,0,0,0,0],stats:[0,0,0,0,0],interests:[0,0,0,0],theme:'peach',topic:'',studentName:''};function load(){try{const saved=JSON.parse(localStorage.getItem('middle3-project'));if(saved)data={...data,...saved}}catch{}const samples={'keyword-1':'#긍정왕','keyword-2':'#축구매니아','keyword-3':'#끈기만점','project-intent':'이 포스터를 통해 내 중학교 3년을 어떤 이야기로 보여주고 싶은지 작성해보세요.','poster-headline':'시련을 너머 단단해진 나의 3년, 우정과 함께 날아오르다!','poster-subline':'데이터 수치로 증명된 나만의 단단한 성장의 기록','insight-pattern':'2학년 때 스트레스가 일시적으로 올랐으나 친구들과의 교류를 통해 3학년 때 행복감이 크게 늘어남.','moment-1':'입학식 첫 만남과 설레었던 체육대회','moment-2':'수학여행 밤 동아리 친구들과 밤샘 수다','moment-3':'학교 축제 무대 공연 성공과 졸업 사진 촬영','top-1':'방과 후 매점 앞 친구들과 먹던 떡볶이','top-2':'동아리 발표회 최우수상 수상 순간','top-3':'시험 끝난 직후 다 함께 간 노래방','studentName':'김졸업'};for(const [key,value] of Object.entries(samples))if(data[key]===value)data[key]='';if(JSON.stringify(data.happy)==='[70,80,90,70,80,90]')data.happy=[0,0,0,0,0,0];if(JSON.stringify(data.stress)==='[20,35,20,35,20,35]')data.stress=[0,0,0,0,0,0];if(JSON.stringify(data.stats)==='[85,90,75,80,88]')data.stats=[0,0,0,0,0];if(JSON.stringify(data.interests)==='[35,25,25,15]')data.interests=[0,0,0,0];if(data.topic==='growth')data.topic=''}function save(){const n=document.querySelector('#studentName');if(n)data.studentName=n.value;localStorage.setItem('middle3-project',JSON.stringify(data))}function val(id){return data[id]??''}function set(id,v){data[id]=v;save()}function setThemeColor(){const edge={peach:"#efb4ca",mint:"#a8d9c2",lavender:"#c7b9e6",lemon:"#ead78e"}[data.theme]||"#c7b9e6";document.documentElement.style.setProperty("--theme-edge",edge);document.documentElement.style.setProperty("--accent","#c9b5e8")}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function input(id,label,placeholder=''){return `<div class="field"><label>${label}</label><input data-id="${id}" value="${esc(val(id))}" placeholder="${esc(placeholder)}"></div>`}function area(id,label,placeholder=''){return `<div class="widefield"><label class="label">${label}</label><textarea data-id="${id}" placeholder="${esc(placeholder)}">${esc(val(id))}</textarea></div>`}function tabs(){document.querySelector('#tabs').innerHTML=steps.map((s,i)=>`<button class="tab ${step===i?'active':''}" data-step="${i}">${'STEP '+String(i+1).padStart(2,'0')+': '}${s[0]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(+b.dataset.step))}function go(n){setThemeColor();step=Math.max(0,Math.min(4,n));document.querySelector('#stepLabel').textContent='STEP 0'+(step+1);document.querySelector('#stepTitle').textContent=steps[step][1];document.querySelector('#stepDesc').textContent=steps[step][2];tabs();render();window.scrollTo({top:0,behavior:'smooth'})}function cardActions(prev,next){return `<div class="actions">${prev?'<button class="btn" data-prev>이전</button>':'<span></span>'}<button class="btn primary" data-next>${next} →</button></div>`}function bind(){document.querySelectorAll('[data-id]').forEach(el=>{let ev=el.tagName==='INPUT'?'input':'input';el.addEventListener(ev,()=>{set(el.dataset.id,el.value);if(step===4)updatePoster()})});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>go(step-1));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>go(Math.min(4,step+1)));document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>toast('프로젝트를 마무리했어요. 입력 내용은 이 브라우저에 저장되어 있어요.'));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;data.topic=topic;document.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('selected',x.dataset.topic===topic));save()});document.querySelectorAll('input[data-theme]').forEach(radio=>radio.addEventListener('change',()=>{if(!radio.checked)return;data.theme=radio.value;setThemeColor();document.querySelectorAll('[data-theme-card]').forEach(card=>{const selected=card.dataset.themeCard===data.theme;card.classList.toggle('selected',selected)});const status=document.querySelector('#themeSelectionStatus');if(status)status.textContent='현재 선택: '+(themes[data.theme]?.[0]||'피치 핑크');const poster=document.querySelector('#poster');if(poster)poster.style.background=themes[data.theme][1];save()}));document.querySelectorAll('[data-range]').forEach(el=>el.oninput=()=>{let [key,i]=el.dataset.range.split(':');data[key][+i]=+el.value;el.style.setProperty('--fill',el.value+'%');el.nextElementSibling.textContent=el.value;save();if(step===4)updatePoster()});document.querySelectorAll('[data-array]').forEach(el=>el.oninput=()=>{let [key,i]=el.dataset.array.split(':');data[key][+i]=+el.value;el.style.setProperty('--fill',el.value+'%');el.parentElement.querySelector('b').textContent=el.value;save();if(step===4)updatePoster()});document.querySelectorAll('[data-interest]').forEach(el=>el.oninput=()=>{let i=+el.dataset.interest;data.interests[i]=+el.value;el.style.setProperty('--fill',el.value+'%');el.parentElement.querySelector('b').textContent=el.value+'%';document.querySelector('#sumInterests').textContent=data.interests.reduce((a,b)=>a+b,0)+'%';save()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filtered=b.dataset.filter;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewMode=viewMode==='3인칭'?'1인칭':'3인칭';render()});document.querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>{showList=!showList;render()});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>window.print());document.querySelectorAll('[data-booth]').forEach(b=>b.onclick=()=>toast('작품 이젤을 선택했어요. 작품 목록에서도 내용을 확인할 수 있어요.'));document.querySelectorAll('[data-image-save]').forEach(b=>b.onclick=savePosterImage)}function render(){setThemeColor();let s='';if(step===0)s=`<section class="panel"><h3 class="section-title">이번 프로젝트 주제 선택 <span class="subtle">한 가지를 골라보세요</span></h3><div class="grid topics">${topics.map(t=>`<article data-topic="${t[0]}" class="topic ${data.topic===t[0]?'selected':''}"><div class="emoji" style="background:${t[4]}">${t[1]}</div><h3>${t[2]}</h3><p>${t[3]}</p></article>`).join('')}</div></section><section class="panel"><h3 class="section-title">나를 표현하는 3가지 대표 키워드</h3><div class="fields">${input('keyword-1','키워드 1','키워드를 입력하세요')}${input('keyword-2','키워드 2','키워드를 입력하세요')}${input('keyword-3','키워드 3','키워드를 입력하세요')}</div>${input('poster-headline','내 인포그래픽 포스터 제목을 직접 써 보세요','나의 중학교 3년을 담은 제목')}${area('project-intent','인포그래픽 기획 의도 및 핵심 메시지','이 포스터를 통해 내 중학교 3년을 어떤 이야기로 보여주고 싶은지 작성해보세요.')}</section>${cardActions(false,'다음 (2STEP 데이터 수집)')}`;
if(step===1){let sem=['1학년 1학기','1학년 2학기','2학년 1학기','2학년 2학기','3학년 1학기','3학년 2학기'];s=`<section class="panel"><h3 class="section-title">😊 학기별 행복 지수 <span class="subtle">0~100점</span></h3><div class="grade-metrics">${[1,2,3].map(g=>`<div class="grade-card"><h4>${g}학년</h4>${[0,1].map(term=>{const i=(g-1)*2+term;return `<div class="row"><div class="semester">${term+1}학기</div><div class="range" data-kind="happy"><input aria-label="${g}학년 ${term+1}학기 행복 지수" type="range" min="0" max="100" value="${data.happy[i]}" style="--fill:${data.happy[i]}%" data-range="happy:${i}"><b>${data.happy[i]}</b></div></div>`}).join('')}</div>`).join('')}</div></section><section class="panel"><h3 class="section-title">🌿 학기별 스트레스 지수 <span class="subtle">0~100점</span></h3><div class="grade-metrics">${[1,2,3].map(g=>`<div class="grade-card"><h4>${g}학년</h4>${[0,1].map(term=>{const i=(g-1)*2+term;return `<div class="row"><div class="semester">${term+1}학기</div><div class="range" data-kind="stress"><input aria-label="${g}학년 ${term+1}학기 스트레스 지수" type="range" min="0" max="100" value="${data.stress[i]}" style="--fill:${data.stress[i]}%" data-range="stress:${i}"><b>${data.stress[i]}</b></div></div>`}).join('')}</div>`).join('')}</div></section><section class="panel"><h3 class="section-title">🛡️ 5대 성장 능력치 <span class="subtle">(레이더 차트용 · 0~100)</span></h3><div class="grid meters">${['학업 및 지식','친화력 및 사교성','체력 및 활동성','창의력 및 예술','멘탈 및 회복탄력성'].map((x,i)=>`<div class="meter"><label>${x}</label><input type="range" min="0" max="100" value="${data.stats[i]}" style="--fill:${data.stats[i]}%" data-array="stats:${i}"><b>${data.stats[i]}</b></div>`).join('')}</div></section><section class="panel"><h3 class="section-title">🍩 중학교 생활 관심사 비중 <span class="subtle">합계 100% 권장 · 현재 <b id="sumInterests">${data.interests.reduce((a,b)=>a+b,0)}%</b></span></h3><div class="grid four">${['친구/우정','학업/시험','취미/게임/소셜','진로/꿈'].map((x,i)=>`<div class="meter"><label>${x}</label><input type="range" min="0" max="100" value="${data.interests[i]}" style="--fill:${data.interests[i]}%" data-interest="${i}"><b>${data.interests[i]}%</b></div>`).join('')}</div></section><section class="panel"><h3 class="section-title">🕰️ 중학교 3년 결정적 순간 타임라인</h3><div class="grid three">${[1,2,3].map(i=>input('moment-'+i,i+'학년 대표 순간')).join('')}</div></section><section class="panel"><h3 class="section-title">👑 중학교 나의 최애 TOP 3</h3><div class="grid three">${[1,2,3].map(i=>input('top-'+i,['🥇 1위','🥈 2위','🥉 3위'][i-1])).join('')}</div></section><section class="panel"><h3 class="section-title">📝 STEP 2 나를 보여주는 기록</h3><p class="subtle">질문마다 짧은 수치나 기록을 입력하세요. 포스터에 간결하게 표시됩니다.</p><div class="grid extra-data-input-grid">${extraQuestions.map((question,i)=>`<div class="extra-data-input"><h4>${i+1}. ${question}</h4><input class="extra-answer" data-id="extra-value-${i+1}" maxlength="48" value="${esc(val('extra-value-'+(i+1)))}" placeholder="${extraExamples[i]}" aria-label="${question}"></div>`).join('')}</div></section>${cardActions(true,'다음 (3STEP 데이터 분석)')}`}
if(step===2){let avg=Math.round(data.happy.reduce((a,b)=>a+b,0)/6*10)/10,si=data.stats.indexOf(Math.max(...data.stats)),ii=data.interests.indexOf(Math.max(...data.interests));s=`<section class="grid cards3"><div class="panel summary"><span>평균 행복지수</span><strong>${avg}점</strong><span>지난 3년간의 평균 행복 수치</span></div><div class="panel summary"><span>최고 역량</span><strong style="font-size:20px">${['학업 및 지식','친화력 및 사교성','체력 및 활동성','창의력 및 예술','멘탈 및 회복탄력성'][si]}</strong><span>5대 능력치 중 가장 우수한 항목</span></div><div class="panel summary"><span>최대 관심사</span><strong style="font-size:20px">${['친구/우정','학업/시험','취미/게임/소셜','진로/꿈'][ii]} (${data.interests[ii]}%)</strong><span>가장 많은 에너지를 쏟은 분야</span></div></section><section class="panel">${area('insight-pattern','데이터 분석으로 발견한 변화 패턴 및 인사이트','수치에서 발견한 변화와 그 이유를 적어보세요.')}${input('poster-subline','포스터 한 줄 설명 (선택)')}</section>${cardActions(true,'다음 (4STEP 시각화 설계)')}`}
if(step===3){s=`<section class="panel"><h3 class="section-title">포스터 시각화 테마 선택</h3><p class="subtle">배경 테마를 선택하면 아래 인포그래픽에 바로 적용됩니다.</p><p id="themeSelectionStatus" class="theme-status" aria-live="polite">현재 선택: ${themes[data.theme]?.[0]||'피치 핑크'}</p><div class="grid themes">${Object.entries(themes).map(([k,v])=>`<label data-theme-card="${k}" class="theme ${data.theme===k?'selected':''}" style="background:${v[1]}"><input type="radio" name="posterTheme" data-theme="${k}" value="${k}" ${data.theme===k?'checked':''}><span class="theme-copy"><h3>${v[0]}</h3><p>${{peach:'따뜻하고 러블리한 감성',mint:'싱그럽고 청량한 분위기',lavender:'몽환적이고 차분한 고급스러움',lemon:'통통 튀고 활기찬 에너지'}[k]}</p></span></label>`).join('')}</div></section><section class="panel"><h3 class="section-title">포스터 구성 항목</h3><div class="checks">${['학기별 행복/스트레스 차트','5대 성장 능력치','생활 관심사 비중','3년 타임라인 & TOP 3'].map(x=>`<label class="check"><input type="checkbox" checked> ${x}</label>`).join('')}</div></section><div class="actions"><button class="btn primary" data-image-save>이미지로 저장 (PNG)</button></div><section class="panel" id="poster-panel"><h3 class="section-title">완성된 나의 인포그래픽 포스터</h3><div class="poster" id="poster" style="background:${themes[data.theme][1]}">${posterHTML()}</div></section>${cardActions(true,'다음 (5STEP 성찰 및 전시)')}`}
if(step===4)s=`<section class="panel"><h3 class="section-title">5STEP · 나의 중학교 3년 돌아보기</h3>${area('final-reflection','프로젝트 성찰문','데이터를 정리하며 새롭게 발견한 나의 모습과 기억에 남는 순간, 앞으로의 목표를 적어보세요.')}</section><div class="actions"><button class="btn" data-prev>이전</button><button class="btn primary" data-finish>프로젝트 완료</button></div>`;
document.querySelector('#screen').innerHTML=s;bind()}function metricChart(title,key,color,icon){const values=data[key];return `<article class="chartbox metric-chart ${key}-chart"><h3>${icon} ${title} <span class="metric-unit">학기별 · 0~100점</span></h3><div class="metric-grade-grid">${[1,2,3].map(g=>`<section class="metric-grade"><h4>${g}학년</h4>${[0,1].map(term=>{const i=(g-1)*2+term;return `<div class="metric-line"><span>${term+1}학기</span><div class="track"><div class="fill" style="width:${values[i]}%;background:${color}"></div></div><b>${values[i]}</b></div>`}).join('')}</section>`).join('')}</div></article>`}function posterHTML(){let av=data.happy.reduce((a,b)=>a+b,0)/6,statNames=['학업','친화력','체력','창의력','회복력'],ints=['친구/우정','학업/시험','취미/게임','진로/꿈'];return `<div class="poster-head"><h2 class="poster-title">${esc(val('poster-headline')||'나의 중학교 3년 기록')}</h2><p>${esc(val('poster-subline'))}</p><div class="kw">${[val('keyword-1'),val('keyword-2'),val('keyword-3')].filter(Boolean).map(esc).join('　')}</div></div><div class="charts">${metricChart('행복 지수','happy','var(--happy)','😊')}${metricChart('스트레스 지수','stress','var(--stress)','🌿')}<article class="chartbox"><h3>🛡️ 나의 5대 성장 능력치</h3><div class="bars">${statNames.map((x,i)=>`<div class="barrow"><span>${x}</span><div class="track"><div class="fill" style="width:${data.stats[i]}%"></div></div><b>${data.stats[i]}</b></div>`).join('')}</div></article><article class="chartbox"><h3>🍩 관심사 비중</h3><div class="bars">${ints.map((x,i)=>`<div class="barrow"><span>${x}</span><div class="track"><div class="fill" style="width:${data.interests[i]}%"></div></div><b>${data.interests[i]}%</b></div>`).join('')}</div></article><article class="chartbox"><h3>💡 데이터 분석 인사이트</h3><p class="insight">${esc(val('insight-pattern'))}</p><strong>지난 3년 평균 행복지수 ${Math.round(av)}점</strong></article><article class="chartbox"><h3>👑 중학교 나의 TOP 3 기록</h3><div class="timeline">${[1,2,3].map(i=>`<div class="timeitem"><b>${i}위</b>${esc(val('top-'+i))}</div>`).join('')}</div></article><article class="chartbox"><h3>🕰️ 중학교 3년 타임라인</h3><div class="timeline">${[1,2,3].map(i=>`<div class="timeitem"><b>${i}학년</b>${esc(val('moment-'+i))}</div>`).join('')}</div></article><article class="chartbox extra-data-chart"><h3>📝 STEP 2 나를 보여주는 기록</h3><div class="poster-extra-list">${[1,2,3].filter(i=>String(val('extra-value-'+i)||'').trim()).map(i=>`<div class="poster-extra-item"><b>${i}. ${esc(extraQuestions[i-1])}</b><span>${esc(val('extra-value-'+i))}</span></div>`).join('')||'<p class="subtle">STEP 2의 질문에 답하면 이곳에 표시됩니다.</p>'}</div></article></div><p style="text-align:center;font-size:11px;margin:20px 0 0">Middle School 3-Year Life Infographic · My Story, My Growth</p>`}function updatePoster(){const p=document.querySelector('#poster');if(p)p.innerHTML=posterHTML()}async function savePosterImage(){const poster=document.querySelector('#poster');if(!poster){toast('포스터 화면에서 저장해 주세요.');return}try{const pageW=794,pageH=1123,pad=40,contentW=pageW-pad*2,clone=poster.cloneNode(true);clone.style.width=contentW+'px';clone.style.maxWidth='none';clone.style.margin='0';clone.style.padding='22px';clone.style.boxShadow='none';clone.style.borderRadius='0';const measure=document.createElement('div');measure.style.cssText='position:fixed;left:-10000px;top:0;width:'+contentW+'px;visibility:hidden;';measure.appendChild(clone);document.body.appendChild(measure);const contentH=Math.max(clone.scrollHeight,clone.getBoundingClientRect().height);measure.remove();const scale=Math.min(1,(pageH-pad*2)/contentH);const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');const markup=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="${pageW*2}" height="${pageH*2}" viewBox="0 0 ${pageW} ${pageH}"><foreignObject x="0" y="0" width="${pageW}" height="${pageH}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${pageW}px;height:${pageH}px;overflow:hidden;background:#fff;padding:${pad}px;box-sizing:border-box"><style><![CDATA[${css}]]></style><div style="width:${contentW}px;transform:scale(${scale});transform-origin:top left">${clone.outerHTML}</div></div></foreignObject></svg>`;const blob=new Blob([markup],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=pageW*2;canvas.height=pageH*2;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(2,2);ctx.drawImage(img,0,0,pageW,pageH);URL.revokeObjectURL(url);canvas.toBlob(file=>{if(!file){toast('이미지를 만들지 못했어요. 다시 시도해 주세요.');return}const downloadUrl=URL.createObjectURL(file),a=document.createElement('a');a.href=downloadUrl;a.download='나의_중학교_3년_인포그래픽.png';a.click();setTimeout(()=>URL.revokeObjectURL(downloadUrl),1000);toast('한 페이지 이미지로 저장했어요.')},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);toast('이 브라우저에서 이미지 저장을 처리하지 못했어요.')};img.src=url}catch(e){toast('이미지 저장 중 문제가 생겼어요. 다시 시도해 주세요.')}}function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2300)}load();setThemeColor();tabs();render();
</script></body></html>
