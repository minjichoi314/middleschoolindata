s="fill" style="width:${data.stats[i]}%"></div></div><b>${data.stats[i]}</b></div>`).join('')}</div></article><article class="chartbox"><h3>🍩 관심사 비중</h3><div class="bars">${ints.map((x,i)=>`<div class="barrow"><span>${x}</span><div class="track"><div class="fill" style="width:${data.interests[i]}%"></div></div><b>${data.interests[i]}%</b></div>`).join('')}</div></article><article class="chartbox"><h3>💡 데이터 분석 인사이트</h3><p class="insight">${esc(val('insight-pattern'))}</p><strong>지난 3년 평균 행복지수 ${Math.round(av)}점</strong></article><article class="chartbox"><h3>👑 중학교 나의 TOP 3 기록</h3><div class="timeline">${[1,2,3].map(i=>`<div class="timeitem"><b>${i}위</b>${esc(val('top-'+i))}</div>`).join('')}</div></article><article class="chartbox"><h3>🕰️ 중학교 3년 타임라인</h3><div class="timeline">${[1,2,3].map(i=>`<div class="timeitem"><b>${i}학년</b>${esc(val('moment-'+i))}</div>`).join('')}</div></article><article class="chartbox extra-data-chart"><h3>📝 STEP 2 나를 보여주는 기록</h3><div class="poster-extra-list">${[1,2,3].filter(i=>String(val('extra-value-'+i)||'').trim()).map(i=>`<div class="poster-extra-item"><b>${i}. ${esc(extraQuestions[i-1])}</b><span>${esc(val('extra-value-'+i))}</span></div>`).join('')||'<p class="subtle">STEP 2의 질문에 답하면 이곳에 표시됩니다.</p>'}</div></article></div><p style="text-align:center;font-size:11px;margin:20px 0 0">Middle School 3-Year Life Infographic · My Story, My Growth</p>`}function updatePoster(){const p=document.querySelector('#poster');if(p)p.innerHTML=posterHTML()}function hideDownloadLink(id){const link=document.getElementById(id);if(!link)return;if(link.dataset.objectUrl){URL.revokeObjectURL(link.dataset.objectUrl);delete link.dataset.objectUrl}link.classList.add('hide');link.removeAttribute('href')}function offerDownloadLink(id,blob,fileName,label){const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=fileName;link.style.display='none';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}async function savePosterImage(selector='#poster',fileName='나의_중학교_3년_포스터.png'){if(!document.querySelector(selector)){toast('포스터 미리보기를 먼저 만들어 주세요.');return}saveInfographicPng('posterDownloadLink',fileName,'포스터 PNG를 저장하고 있어요.',buildPosterSVG)}function buildPosterSVG(){const W=1100,H=1500,happy=data.happy.map(n=>Math.max(0,Math.min(100,Number(n)||0))),stress=data.stress.map(n=>Math.max(0,Math.min(100,Number(n)||0))),stats=data.stats.map(n=>Math.max(0,Math.min(100,Number(n)||0))),interests=data.interests.map(n=>Math.max(0,Number(n)||0)),title=val('poster-headline')||'나의 중학교 3년 기록',sub=val('poster-subline')||'중학교 3년 동안의 나를 데이터로 살펴봅니다',bg=themes[data.theme]?.[1]||'#fff0f6',ink='#28344a',terms=['1-1','1-2','2-1','2-2','3-1','3-2'];let o=['<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1500" viewBox="0 0 1100 1500"><rect width="1100" height="1500" fill="'+bg+'"/>'];const tx=(x,y,t,z=18,c=ink,w=700,a='start')=>o.push(svgText(x,y,t,z,c,w,a)),box=(x,y,w,h)=>o.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="22" fill="#fff" stroke="#e3e7ef" stroke-width="2"/>'),wrap=(t,x,y,n=36,lh=21,z=14,c=ink,max=2,a='start')=>o.push(svgLines(t,x,y,n,lh,z,c,max,600,a));tx(550,77,title,38,ink,900,'middle');wrap(sub,550,115,72,22,16,'#65728a',1,'middle');tx(550,155,[1,2,3].map(i=>val('keyword-'+i)).filter(Boolean).join('   ·   '),14,'#765b91',700,'middle');box(42,185,1016,445);tx(72,225,'학기별 행복 · 스트레스',21,ink,900);tx(1020,225,'점수 / 100',12,'#78839a',700,'end');for(let i=0;i<6;i++){let y=278+i*54;tx(75,y+4,terms[i],14,ink,800);tx(150,y,'행복',12,'#8a6f83',700);o.push('<rect x="205" y="'+(y-14)+'" width="515" height="14" rx="7" fill="#f0edf2"/><rect x="205" y="'+(y-14)+'" width="'+(515*happy[i]/100)+'" height="14" rx="7" fill="#f3d975"/>');tx(735,y-2,happy[i],13,ink,800);tx(780,y,'스트레스',12,'#718965',700);o.push('<rect x="850" y="'+(y-14)+'" width="150" height="14" rx="7" fill="#f0edf2"/><rect x="850" y="'+(y-14)+'" width="'+(150*stress[i]/100)+'" height="14" rx="7" fill="#abd391"/>');tx(1020,y-2,stress[i],13,ink,800,'end')}box(42,650,1016,270);tx(72,690,'나의 5대 성장 역량',21,ink,900);const sn=['학업','친화력','체력','창의력','회복력'];for(let i=0;i<5;i++){let y=740+i*34;tx(78,y,sn[i],13,ink,700);o.push('<rect x="220" y="'+(y-12)+'" width="700" height="13" rx="7" fill="#f0edf2"/><rect x="220" y="'+(y-12)+'" width="'+(700*stats[i]/100)+'" height="13" rx="7" fill="#bca7d7"/>');tx(970,y,stats[i],13,ink,800,'end')}box(42,940,492,240);tx(72,980,'생활 관심사 비중',20,ink,900);const il=['친구/우정','학업/시험','취미/게임','진로/꿈'];for(let i=0;i<4;i++){let y=1025+i*35;tx(76,y,il[i],13,ink,700);o.push('<rect x="220" y="'+(y-12)+'" width="220" height="12" rx="6" fill="#f0edf2"/><rect x="220" y="'+(y-12)+'" width="'+(220*interests[i]/100)+'" height="12" rx="6" fill="'+['#e7adc0','#abd7c6','#f0d87a','#bda9dc'][i]+'"/>');tx(470,y,(interests[i]||0)+'%',13,ink,800,'end')}box(558,940,500,240);tx(588,980,'3년의 주요 순간',20,ink,900);for(let i=1;i<=3;i++){let y=1025+(i-1)*48;tx(590,y,i+'학년',13,'#84689b',800);wrap(val('moment-'+i)||'기록 없음',680,y,36,19,13,ink,1)}box(42,1200,1016,245);tx(72,1240,'기억에 남는 TOP 3',20,ink,900);for(let i=1;i<=3;i++){let x=85+(i-1)*330;tx(x,1285,i+'위',14,'#926eaa',900);wrap(val('top-'+i)||'기록 없음',x+54,1285,30,20,13,ink,2)}tx(72,1390,'데이터 분석 인사이트',14,'#765b91',800);wrap(val('insight-pattern')||'분석 내용을 입력해 보세요.',265,1390,85,20,13,ink,1);o.push('</svg>');return o.join('')}function buildInfographicPrompt(){const terms=['1학년 1학기','1학년 2학기','2학년 1학기','2학년 2학기','3학년 1학기','3학년 2학기'],selectedTopic=topics.find(t=>t[0]===data.topic),extras=[1,2,3].map(i=>val('extra-value-'+i)).filter(Boolean).join(' / '),tops=[1,2,3].map(i=>i+'위 '+val('top-'+i)).filter(x=>x.trim()!=='위').join(', '),moments=[1,2,3].map(i=>i+'학년 '+val('moment-'+i)).filter(x=>x.trim()!=='학년').join(', ');return 'STEP 1~3의 실제 데이터를 담은 귀엽고 정돈된 중학교 3년 인포그래픽을 만든다. 밝은 흰색 바탕, 여백이 넉넉한 둥근 카드, 연한 초록에서 짙은 초록으로 이어지는 하트 도형을 활용한다. 단순한 파스텔 도형과 부드러운 선으로 표현하고, 글자와 그림이 겹치지 않도록 영역을 분리한다. 읽기 쉬운 정확한 한국어를 사용하고 포스터를 그대로 복제하지 말고 정보를 새로운 인포그래픽 레이아웃으로 구성한다.\n[STEP 1 기획]\n주제: '+(selectedTopic?selectedTopic[2]+' ('+selectedTopic[3]+')':'미선택')+'\n기획 의도: '+(val('project-intent')||'미입력')+'\n제목: '+(val('poster-headline')||'데이터로 정리하는 나의 중학교 3년')+'\n대표 키워드: '+([1,2,3].map(i=>val('keyword-'+i)).filter(Boolean).join(', ')||'미입력')+'\n[STEP 2 데이터 수집]\n행복: '+terms.map((x,i)=>x+' '+data.happy[i]+'점').join(', ')+'\n스트레스: '+terms.map((x,i)=>x+' '+data.stress[i]+'점').join(', ')+'\n성장 역량: '+['학업','친화력','체력','창의력','회복탄력성'].map((x,i)=>x+' '+data.stats[i]+'점').join(', ')+'\n생활 관심사: '+['친구/우정','학업/시험','취미/게임/소셜','진로/꿈'].map((x,i)=>x+' '+data.interests[i]+'%').join(', ')+'\n추가 기록: '+(extras||'미입력')+'\n[STEP 3 데이터 분석 및 기록]\n분석 인사이트: '+(val('insight-pattern')||'미입력')+'\n한 줄 설명: '+(val('poster-subline')||'미입력')+'\n학년별 순간: '+(moments||'미입력')+'\nTOP 3: '+(tops||'미입력')+'\n테마 '+(themes[data.theme]?.[0]||'피치 핑크')+'에 맞춰 행복은 연노랑, 스트레스는 연두색으로 표시한다. 상단 큰 제목, 왼쪽 구름 패널의 학기별 감정 데이터와 관심사 원형 그래프, 오른쪽 5대 성장역량 및 캐릭터 아이콘, 하단 3년 추억 타임라인과 TOP 3 및 분석 인사이트로 구성한다. 1000x1400 세로형. 입력한 수치와 문구를 정확히 쓴다.'}async function copyInfographicPrompt(){const input=document.querySelector('#infographicPrompt'),status=document.querySelector('#copyPromptStatus');if(!input)return;const text=input.value.trim();if(!text){if(status)status.textContent='복사할 프롬프트가 없습니다.';return}let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true}}catch(e){}if(!copied){const helper=document.createElement('textarea');helper.value=text;helper.setAttribute('readonly','');helper.style.position='fixed';helper.style.left='-9999px';helper.style.top='0';document.body.appendChild(helper);helper.focus();helper.select();helper.setSelectionRange(0,helper.value.length);try{copied=document.execCommand('copy')}catch(e){copied=false}helper.remove()}if(copied){if(status)status.textContent='프롬프트를 복사했어요. 이미지 생성 도구에 붙여 넣으세요.';else toast('프롬프트를 복사했어요.')}else{input.focus();input.select();if(status)status.textContent='자동 복사에 실패했어요. 선택된 문장을 길게 눌러 복사해 주세요.';else toast('프롬프트를 선택했습니다. 복사해 주세요.')}}function updatePromptPreview(){const el=document.querySelector('#infographicPrompt');if(el)el.value=buildInfographicPrompt()}function svgText(x,y,text,size=14,color='#283044',weight=400,anchor='start'){return `<text x="${x}" y="${y}" font-family="Noto Sans KR, system-ui, sans-serif" font-size="${size}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}">${esc(text)}</text>`}function svgLines(text,x,y,maxChars=28,lineHeight=20,size=12,color='#4f5260',maxLines=3,weight=400,anchor='start'){const chars=Array.from(String(text||'')),lines=[];while(chars.length&&lines.length<maxLines)lines.push(chars.splice(0,maxChars).join(''));if(chars.length&&lines.length)lines[lines.length-1]=Array.from(lines[lines.length-1]).slice(0,maxChars-1).join('')+'…';return `<text x="${x}" y="${y}" font-family="Noto Sans KR, system-ui, sans-serif" font-size="${size}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}">${lines.map((line,i)=>`<tspan x="${x}" dy="${i?lineHeight:0}">${esc(line)}</tspan>`).join('')}</text>`}function saveInfographicPng(linkId,fileName,message,renderer){hideDownloadLink(linkId);toast(message);let url='';const fail=()=>{if(url){URL.revokeObjectURL(url);url=''}toast('PNG 변환에 실패했어요. 다시 시도해 주세요.')};try{const markup=renderer(),blob=new Blob([markup],{type:'image/svg+xml;charset=utf-8'});url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{try{const dims=markup.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/),scale=2,canvas=document.createElement('canvas');canvas.width=(Number(dims&&dims[1])||1000)*scale;canvas.height=(Number(dims&&dims[2])||1400)*scale;const ctx=canvas.getContext('2d');if(!ctx){fail();return}ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);url='';let file;try{const dataUrl=canvas.toDataURL('image/png'),raw=atob(dataUrl.split(',')[1]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);file=new Blob([bytes],{type:'image/png'})}catch(e){fail();return}offerDownloadLink(linkId,file,fileName,'PNG 이미지 다운로드');toast('PNG 이미지 저장을 시작했어요.')}catch(e){fail()}};img.onerror=fail;img.src=url}catch(e){fail()}}function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2300)}load();setThemeColor();tabs();render();
</script></body></html>
